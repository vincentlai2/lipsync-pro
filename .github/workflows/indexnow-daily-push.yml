name: Daily IndexNow SEO Auto-Push & Email Report

on:
  schedule:
    # Runs automatically every day at 00:05 UTC (8:05 AM Beijing Time)
    - cron: '5 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  indexnow-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run IndexNow Auto-Push Script
        run: npx tsx scripts/push-indexnow.ts

      - name: Generate SEO Drip Schedule & Status Summary
        run: npx tsx scripts/seo-status.ts

      - name: Send Email Report to Gmail (Optional)
        if: env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 🚀 [LipSync.pro] Daily SEO Drip & Published Article Report
          to: ${{ secrets.NOTIFICATION_EMAIL || secrets.MAIL_USERNAME }}
          from: LipSync.pro Bot
          html_body: file://seo-status-report.html
          priority: normal
